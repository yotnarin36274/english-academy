<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Present Perfect Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column app — header band, then one view at a time (home / quiz / result / lesson) */
:root{
  --bg:#eceff2; --card:#ffffff; --ink:#1b2733; --muted:#5f6d79; --line:#d3dae0; --panel:#f1f5f9;
  --navy:#1b3a57; --navy2:#2a5d84; --accent:#e07a2f; --accent-soft:#f6e2d0; --note:#fdf4e6;
  --good:#2f8f6b; --good-soft:#e3f2eb; --warn:#c9811a; --warn-soft:#fbefd9; --bad:#c0392b; --bad-soft:#f8e1de;
  --on-navy:#ffffff;
  --display:"Fredoka","Sarabun",system-ui,sans-serif; --body:"Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a23; --card:#18242f; --ink:#e7edf2; --muted:#9aa9b6; --line:#2c3b49; --panel:#1f2e3b;
  --navy:#9cc3e6; --navy2:#7fb0dc; --accent:#f0954f; --accent-soft:#3a2a1d; --note:#2d2419;
  --good:#5cc39a; --good-soft:#173328; --warn:#e6a94a; --warn-soft:#352a16; --bad:#ec7b6e; --bad-soft:#3a1f1c;
  --on-navy:#0f1a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a23; --card:#18242f; --ink:#e7edf2; --muted:#9aa9b6; --line:#2c3b49; --panel:#1f2e3b;
  --navy:#9cc3e6; --navy2:#7fb0dc; --accent:#f0954f; --accent-soft:#3a2a1d; --note:#2d2419;
  --good:#5cc39a; --good-soft:#173328; --warn:#e6a94a; --warn-soft:#352a16; --bad:#ec7b6e; --bad-soft:#3a1f1c;
  --on-navy:#0f1a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy)}
.brand span{color:var(--accent)}
.who{font-size:14px;color:var(--muted);text-align:right}
.card{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}
.muted{color:var(--muted)}.small{font-size:14px}
button{font-family:var(--body);font-weight:700;font-size:16px;border-radius:12px;padding:11px 16px;cursor:pointer;border:2px solid transparent;background:var(--navy);color:var(--on-navy)}
button.alt{background:transparent;color:var(--navy);border-color:var(--navy)}
button.go{background:var(--accent);color:#fff}
button.link{background:none;border:0;padding:4px 0;color:var(--navy2);text-decoration:underline;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.names button{background:var(--panel);color:var(--ink);border-color:var(--line);font-family:var(--display);font-size:20px;padding:14px}
.names button:hover{border-color:var(--accent)}
input[type=text]{font:inherit;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0;flex:1}
/* topic list */
.topics{display:flex;flex-direction:column;gap:8px}
.tp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 14px;border:0;color:var(--ink);text-align:left;font-weight:400;width:100%}
.tp:hover{outline:2px solid var(--accent)}
.tp .nm{font-weight:700;min-width:0}
.tp .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.bar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-good{background:var(--good-soft);color:var(--good)}.p-new{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.c-bad{background:var(--bad)}.c-warn{background:var(--warn)}.c-good{background:var(--good)}.c-new{background:var(--muted)}
/* quiz */
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtopic{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.qtext{font-size:22px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{background:var(--panel);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:600;font-size:18px;padding:13px 16px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.fb{border-radius:12px;padding:12px 16px;font-size:16px}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.fb b{font-family:var(--display)}
/* result */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:52px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.delta{font-weight:700;font-size:15px}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:18px;border-bottom:2px solid var(--line);overflow-x:auto}
.hist div{flex:0 0 34px;background:var(--navy2);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.hist div.now{background:var(--accent)}
.hist div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.histlab{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.histlab span{flex:0 0 34px;text-align:center}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.res td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.tscroll{overflow-x:auto}
.note{background:var(--note);border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px}
.list{margin:0;padding-left:20px}
.list li{margin:4px 0}
/* lesson */
.rule{background:var(--panel);border-radius:12px;padding:14px 16px}
.rule p{margin:4px 0}
.ex{font-family:var(--body);font-size:17px}
.ex b{color:var(--accent)}
.warnbar{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
@media (max-width:480px){h1{font-size:25px}.qtext{font-size:19px}.opt{font-size:16px}.score .big{font-size:42px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">ENG <span>Spark</span> · Present Perfect Quest</div><div class="who" id="who"></div></header>
  <main id="app"></main>
</div>

<script>
/* =================== CONTENT =================== */
const TOPICS=[
 {id:"form",name:"have / has + V3 · ever / never",lesson:[
  ["ใช้เมื่อไหร่","เล่าว่า<b>เคย / ไม่เคย</b>ทำอะไรในชีวิต โดย<b>ไม่บอกว่าทำเมื่อไหร่</b>","I <b>have eaten</b> a gecko. · She <b>has been</b> to Japan."],
  ["โครงสร้าง","I / You / We / They + <b>have</b> + V3 · He / She / It + <b>has</b> + V3","My brother <b>has been</b> to Bangkok."],
  ["ever / never","<b>ever</b> = เคย (ใช้ในคำถาม) · <b>never</b> = ไม่เคย (ไม่ต้องใส่ not ซ้ำ)","I <b>have never</b> ridden a horse. (ไม่ใช่ haven't never)"],
  ["ถาม &amp; ตอบสั้น","Have/Has + ประธาน + ever + V3 …? · ตอบด้วย have/has","<b>Have</b> you ever seen snow? — Yes, I <b>have</b>. / No, I <b>haven't</b>."]]},
 {id:"v3",name:"กริยาช่อง 3 (V3)",lesson:[
  ["V2 = V3","buy → bought → <b>bought</b> · make → <b>made</b> · meet → <b>met</b> · sleep → <b>slept</b>","have → <b>had</b> · find → <b>found</b> · teach → <b>taught</b> · visit → <b>visited</b>"],
  ["เติม -en / -n","eat → <b>eaten</b> · take → <b>taken</b> · write → <b>written</b> · ride → <b>ridden</b>","see → <b>seen</b> · fly → <b>flown</b> · give → <b>given</b> · break → <b>broken</b>"],
  ["i → a → u","swim → swam → <b>swum</b> · drink → drank → <b>drunk</b> · sing → sang → <b>sung</b>","begin → began → <b>begun</b>"],
  ["Special ⭐","go → went → <b>gone</b> · do → did → <b>done</b> · be → was/were → <b>been</b>","<b>been to</b> = เคยไปแล้วกลับมา · <b>gone to</b> = ไปแล้วยังไม่กลับ"]]},
 {id:"ps",name:"Present Perfect vs Past Simple",lesson:[
  ["Present Perfect","เคย / ไม่เคย · <b>ไม่บอกเวลา</b>","I <b>have been</b> to Phuket. · Have you <b>ever</b> tried durian?"],
  ["Past Simple","บอก<b>เวลาที่จบแล้ว</b>: yesterday, last week, in 2024, two days ago, When…?","I <b>went</b> to Phuket <b>last year</b>. · <b>When did</b> you go?"],
  ["ห้ามผสม","มีคำบอกเวลาในอดีตเมื่อไหร่ → ต้องใช้ Past Simple เท่านั้น","❌ I have been there last year. → ✅ I <b>went</b> there last year."],
  ["คุยต่อแบบเจ้าของภาษา","ถามว่าเคยไหมด้วย Present Perfect แล้วเล่ารายละเอียดด้วย Past Simple","Have you ever been to Bangkok? — Yes, I <b>have</b>. I <b>went</b> there in May."]]},
 {id:"fs",name:"for / since ⭐",lesson:[
  ["for","<b>for</b> + ระยะเวลา (นานเท่าไหร่)","for three years · for a week · for a long time"],
  ["since","<b>since</b> + จุดเริ่มต้น (ตั้งแต่เมื่อไหร่)","since 2020 · since Monday · since I was born"],
  ["ใช้กับ Present Perfect","เรื่องที่เริ่มในอดีตและ<b>ยังเป็นอยู่ถึงตอนนี้</b>","I <b>have lived</b> in Korat <b>since</b> 2015. · She <b>has studied</b> English <b>for</b> six years."],
  ["เคล็ดลับ","ถามตัวเอง: เป็น ‘ช่วงเวลา’ หรือ ‘จุดเวลา’? ช่วง → for · จุด → since","ห้ามใช้ ago กับ Present Perfect"]]},
 {id:"ay",name:"already / yet ⭐",lesson:[
  ["already","= <b>ทำแล้ว</b> (เร็วกว่าที่คิด) · ใช้ในประโยคบอกเล่า · วางหลัง have/has","I have <b>already</b> eaten. · She has <b>already</b> finished."],
  ["yet","= <b>ยัง</b> · ใช้ในประโยค<b>ปฏิเสธ</b>และ<b>คำถาม</b> · วางท้ายประโยค","I haven't finished <b>yet</b>. · Have you finished <b>yet</b>?"],
  ["เทียบกัน","Has the bus come <b>yet</b>? — Yes, it has <b>already</b> come.","The movie hasn't started <b>yet</b>."],
  ["เคล็ดลับ","เห็น not / haven't / hasn't หรือเครื่องหมาย ? → yet","บอกเล่าธรรมดา → already"]]}
];
const TNAME=Object.fromEntries(TOPICS.map(t=>[t.id,t.name]));
const MC=(t,q,o,a,e)=>({t,q,o,a,e});
const BANK=[
 MC("form","My sister ___ never been to Phuket.",["have","has","is","did"],1,"sister = She → has"),
 MC("form","___ they ever played badminton?",["Has","Have","Did","Are"],1,"they → Have"),
 MC("form","Have you ever cooked pad thai? — Yes, I ___.",["have","did","has","do"],0,"ถามด้วย Have → ตอบ have"),
 MC("form","He has never ___ a snake.",["see","saw","seen","seeing"],2,"has never + V3 → seen"),
 MC("form","I ___ eaten durian. It smells bad!",["haven't never","have never","has never","never have"],1,"I + have never + V3 (ไม่ใช้ not ซ้ำ)"),
 MC("form","Has your dad ever ___ a motorbike?",["ride","rode","ridden","riding"],2,"ride → rode → ridden"),
 MC("form","___ you ever eaten sushi?",["Have","Did","Do","Are"],0,"Have you ever + V3?"),
 MC("form","Have you ever seen snow? — No, I ___.",["didn't","haven't","don't","hasn't"],1,"ถามด้วย Have → No, I haven't."),
 MC("form","My brother ___ been to Japan.",["have","is","has","did"],2,"brother = He → has"),
 MC("form","Has she ever met a famous person? — Yes, she ___.",["did","have","has","is"],2,"she → has"),
 MC("form","We have ___ that movie. It's great!",["see","seen","saw","seeing"],1,"have + V3 → seen"),
 MC("form","Which sentence is correct?",["He has never eat durian.","He have never eaten durian.","He has never eaten durian.","He never has eaten durian."],2,"He + has never + V3"),
 MC("ps","I ___ to Chiang Mai last year.",["have gone","went","have been","go"],1,"last year → Past Simple"),
 MC("ps","They ___ the movie yesterday.",["have seen","saw","seen","see"],1,"yesterday → saw"),
 MC("ps","When ___ you meet your best friend?",["have","has","did","do"],2,"When…? → Past Simple · did"),
 MC("ps","I ___ my grandma last weekend.",["have visited","visited","visit","have visit"],1,"last weekend → visited"),
 MC("ps","___ you ever tried mango sticky rice?",["Did","Have","Do","Has"],1,"ever + ไม่บอกเวลา → Have"),
 MC("ps","She ___ to Korat in 2023.",["moved","has moved","moves","has move"],0,"in 2023 → Past Simple"),
 MC("ps","Have you ever been to the zoo? — Yes. I ___ there last month.",["have gone","have been","went","go"],2,"last month → went"),
 MC("ps","When ___ you start learning English?",["did","have","has","do"],0,"When…? → did"),
 MC("ps","Which sentence is correct?",["I have seen him yesterday.","I saw him yesterday.","I have saw him.","I seen him yesterday."],1,"yesterday → Past Simple"),
 MC("ps","I ___ my homework last night.",["have done","done","did","do"],2,"last night → did"),
 MC("ps","Which sentence is correct?",["I have been to Phuket last year.","I have went to Phuket.","I go to Phuket last year.","I went to Phuket last year."],3,"last year → went"),
 MC("ps","Have you ever ridden an elephant? — Yes, I ___ one in Chiang Mai two years ago.",["have ridden","rode","ride","ridden"],1,"two years ago → rode"),
 MC("fs","I have lived in Korat ___ 2015.",["for","since","ago","in"],1,"2015 = จุดเริ่ม → since"),
 MC("fs","We have studied English ___ five years.",["for","since","ago","from"],0,"five years = ช่วงเวลา → for"),
 MC("fs","I have known Jenny ___ 2022.",["ago","for","since","from"],2,"2022 = จุดเริ่ม → since"),
 MC("fs","He has played the guitar ___ three years.",["since","for","ago","in"],1,"three years → for"),
 MC("fs","We have lived here ___ I was born.",["for","ago","yet","since"],3,"since + เหตุการณ์จุดเริ่ม"),
 MC("fs","She has worked at the hospital ___ a long time.",["for","since","ago","already"],0,"a long time → for"),
 MC("fs","They have been friends ___ ป.1.",["for","in","since","ago"],2,"ป.1 = จุดเริ่ม → since"),
 MC("fs","He has worked here ___ three years.",["since","yet","ago","for"],3,"three years → for"),
 MC("fs","I have had this phone ___ last Christmas.",["since","for","ago","in"],0,"last Christmas = จุดเริ่ม → since"),
 MC("fs","My dad has been a teacher ___ 20 years.",["since","for","ago","from"],1,"20 years → for"),
 MC("ay","I haven't finished my homework ___.",["already","yet","ever","since"],1,"ปฏิเสธ → yet"),
 MC("ay","She has ___ eaten lunch. She's full.",["yet","since","already","ever"],2,"ทำแล้ว → already"),
 MC("ay","Have you done your homework ___?",["yet","already","since","ever"],0,"คำถาม → yet"),
 MC("ay","I have ___ seen this movie. Let's watch another one.",["yet","already","ever","since"],1,"ดูแล้ว → already"),
 MC("ay","She hasn't arrived ___.",["already","for","ever","yet"],3,"ปฏิเสธ → yet"),
 MC("ay","We have ___ finished. Can we go now?",["already","yet","since","ever"],0,"บอกเล่า ทำแล้ว → already"),
 MC("ay","Has the bus come ___?",["already","since","yet","for"],2,"คำถาม → yet"),
 MC("ay","“Do you want some cake?” — “No thanks, I've ___ eaten.”",["yet","already","ever","since"],1,"กินแล้ว → already"),
 MC("ay","The movie hasn't started ___.",["yet","already","since","for"],0,"ปฏิเสธ → yet"),
 MC("ay","He has ___ sent me the photos. Look!",["yet","ever","already","since"],2,"ส่งแล้ว → already"),
];
const V3=[["go","gone|been"],["eat","eaten"],["see","seen"],["do","done"],["have","had"],["take","taken"],["write","written"],["ride","ridden"],["swim","swum"],["fly","flown"],["drink","drunk"],["sing","sung"],["speak","spoken"],["break","broken"],["win","won"],["buy","bought"],["make","made"],["meet","met"],["sleep","slept"],["lose","lost"],["read","read"],["be","been"],["give","given"],["forget","forgotten"],["wear","worn"],["catch","caught"],["find","found"],["visit","visited"],["try","tried"],["play","played"],["travel","travelled|traveled"],["cook","cooked"],["teach","taught"],["drive","driven"],["fall","fallen"],["begin","begun"],["come","come"],["run","run"],["know","known"],["think","thought"]];
V3.forEach(([b,p])=>BANK.push({t:"v3",type:"text",q:`V3 ของ “${b}” คือ?`,a:p.split("|"),e:`${b} → ${p.split("|")[0]}`}));
BANK.forEach((q,i)=>q.id=q.t+"-"+i);
const BYT={};BANK.forEach(q=>(BYT[q.t]=BYT[q.t]||[]).push(q));
const STUDENTS=["เจด้า","เจนนี่","ชมพู่"];
const PER_ROUND=3;
/* =================== STORAGE =================== */
const KEY="engspark-pp-quest-v1";let DB={users:{},last:null},STORAGE_OK=true;
try{const raw=localStorage.getItem(KEY);if(raw)DB=JSON.parse(raw);if(!DB.users)DB.users={}}catch(e){STORAGE_OK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){STORAGE_OK=false}}
let ME=null;
function user(){if(!ME)return null;if(!DB.users[ME])DB.users[ME]={rounds:[],stats:{},miss:{},prac:{}};return DB.users[ME]}

/* =================== HELPERS =================== */
const $=s=>document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pct(c,n){return n?Math.round(c/n*100):null}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function status(acc,n){if(acc===null||n===0)return["new","ยังไม่ได้ทำ"];if(acc<60)return["bad","ต้องทบทวน"];if(acc<80)return["warn","ฝึกเพิ่มอีกนิด"];return n>=6?["good","เชี่ยวชาญ"]:["good","ผ่าน"]}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString("th-TH",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}

/* =================== QUIZ ENGINE =================== */
let Q=null; // {mode:'round'|'topic'|'miss', topic, items:[], i, answers:[], locked}
function buildRound(){const u=user();const items=[];
  TOPICS.forEach(t=>{const pool=BYT[t.id];const missed=shuffle(pool.filter(q=>u.miss[q.id]));const rest=shuffle(pool.filter(q=>!u.miss[q.id]));
    const chosen=[...missed.slice(0,1),...rest].slice(0,PER_ROUND);items.push(...chosen)});
  return shuffle(items)}
function startRound(){Q={mode:"round",items:buildRound(),i:0,answers:[],locked:false};renderQ()}
function startTopic(id){const n=id==="v3"?12:8;Q={mode:"topic",topic:id,items:shuffle(BYT[id]).slice(0,n),i:0,answers:[],locked:false};renderQ()}
function startMiss(){const u=user();const ids=Object.keys(u.miss);const items=shuffle(BANK.filter(q=>ids.includes(q.id))).slice(0,12);if(!items.length)return;Q={mode:"miss",items,i:0,answers:[],locked:false};renderQ()}
function renderQ(){const q=Q.items[Q.i],n=Q.items.length;const title=Q.mode==="round"?"Check-up รอบที่ "+(user().rounds.length+1):Q.mode==="miss"?"ฝึกข้อที่เคยผิด":"ฝึก: "+TNAME[Q.topic];
  let body;
  if(q.type==="text"){body=`<form class="row" id="tform" onsubmit="event.preventDefault();answerText()"><input type="text" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ"><button class="go" type="submit" id="tbtn">ตรวจ</button></form>`}
  else body=`<div class="opts">${q.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})">${esc(o)}</button>`).join("")}</div>`;
  $().innerHTML=`<div class="card stack"><div class="row" style="justify-content:space-between"><b style="color:var(--navy)">${title}</b><span class="muted small">ข้อ ${Q.i+1} / ${n}</span></div>
  <div class="prog"><i style="width:${Q.i/n*100}%"></i></div>
  <div class="qtopic">${esc(TNAME[q.t])}</div><div class="qtext">${esc(q.q)}</div>${body}<div id="fb"></div>
  <div class="row" style="justify-content:space-between"><button class="link" onclick="quitQ()">ออกจากแบบฝึก</button><button class="go" id="nx" hidden onclick="nextQ()">${Q.i+1<n?"ข้อต่อไป →":"ดูผล →"}</button></div></div>`;
  const ti=document.getElementById("tin");if(ti)ti.focus()}
function record(ok){const q=Q.items[Q.i],u=user();Q.answers.push({id:q.id,t:q.t,ok});
  const s=u.stats[q.t]||(u.stats[q.t]={c:0,n:0});s.n++;if(ok)s.c++;
  if(ok){if(u.miss[q.id]){u.miss[q.id]--;if(u.miss[q.id]<=0)delete u.miss[q.id]}}else u.miss[q.id]=2;
  save();Q.locked=true;document.getElementById("nx").hidden=false;document.getElementById("nx").focus()}
function feedback(ok,correctText,e){document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"ถูกต้อง! 🎉":"ยังไม่ถูก"}</b>${ok?"":` · คำตอบคือ <b>${esc(correctText)}</b>`}<br>${esc(e)}</div>`}
function answer(k){if(Q.locked)return;const q=Q.items[Q.i],ok=k===q.a;
  q.o.forEach((_,j)=>{const b=document.getElementById("o"+j);b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  feedback(ok,q.o[q.a],q.e);record(ok)}
function answerText(){if(Q.locked)return;const q=Q.items[Q.i],inp=document.getElementById("tin");const v=inp.value.trim().toLowerCase();if(!v)return;
  const ok=q.a.includes(v);inp.disabled=true;document.getElementById("tbtn").disabled=true;inp.style.borderColor=ok?"var(--good)":"var(--bad)";
  feedback(ok,q.a[0],q.e);record(ok)}
function nextQ(){Q.i++;Q.locked=false;if(Q.i<Q.items.length)renderQ();else finishQ()}
function quitQ(){Q=null;home()}
document.addEventListener("keydown",e=>{if(!Q||e.target.tagName==="INPUT")return;if(Q.locked&&e.key==="Enter"){e.preventDefault();nextQ()}else if(!Q.locked&&["1","2","3","4"].includes(e.key)&&Q.items[Q.i].o){answer(+e.key-1)}});

/* =================== RESULTS =================== */
function finishQ(){const u=user();const by={};Q.answers.forEach(a=>{const b=by[a.t]||(by[a.t]=[0,0]);b[1]++;if(a.ok)b[0]++});
  const c=Q.answers.filter(a=>a.ok).length,n=Q.answers.length;
  if(Q.mode==="round"){u.rounds.push({at:Date.now(),c,n,by});save();const mode=Q.mode;Q=null;roundResult(u.rounds.length-1)}
  else if(Q.mode==="topic"){const t=Q.topic;const log=u.prac[t]||(u.prac[t]=[]);const prev=log.length?log[log.length-1]:null;log.push({at:Date.now(),c,n});save();Q=null;topicResult(t,c,n,prev)}
  else{Q=null;missResult(c,n)}}
function roundResult(idx){const u=user(),r=u.rounds[idx],prev=idx>0?u.rounds[idx-1]:null;
  const rows=TOPICS.map(t=>{const now=r.by[t.id]||[0,0],p=prev&&prev.by[t.id]?prev.by[t.id]:null,s=u.stats[t.id]||{c:0,n:0},cum=pct(s.c,s.n);
    const nowP=pct(now[0],now[1]),pP=p?pct(p[0],p[1]):null;let trend="ใหม่",cls="p-new";
    if(pP!==null){if(nowP>pP){trend="↑ ดีขึ้น";cls="p-good"}else if(nowP<pP){trend="↓ ลดลง";cls="p-bad"}else{trend="= เท่าเดิม";cls="p-new"}}
    let st=status(cum,s.n);if(now[1]&&now[0]===0)st=["bad","ต้องทบทวน"];else if(pP!==null&&nowP<pP&&st[0]==="good")st=["warn","ฝึกเพิ่มอีกนิด"];
    return {t,now,pP,nowP,trend,cls,cum,n:s.n,st}});
  const need=rows.filter(x=>x.st[0]==="bad").sort((a,b)=>(a.cum??0)-(b.cum??0));
  const more=rows.filter(x=>x.st[0]==="warn").sort((a,b)=>(a.cum??0)-(b.cum??0));
  const up=rows.filter(x=>x.trend.startsWith("↑")),down=rows.filter(x=>x.trend.startsWith("↓"));
  const d=prev?r.c-prev.c:null;
  const hist=u.rounds.slice(-12);const max=Math.max(...hist.map(h=>h.n));const start=u.rounds.length-hist.length;
  const recBtn=x=>`<li><b>${esc(x.t.name)}</b> <span class="muted small">(สะสม ${x.cum??0}%)</span> · <button class="link" onclick="lesson('${x.t.id}')">ไปทบทวน →</button></li>`;
  $().innerHTML=`<div class="stack">
  <div class="card stack"><h2>ผล Check-up รอบที่ ${idx+1}</h2>
   <div class="score"><span class="big">${r.c}/${r.n}</span><span class="muted">(${pct(r.c,r.n)}%)</span>${d===null?`<span class="pill p-new">รอบแรก</span>`:`<span class="delta" style="color:${d>0?"var(--good)":d<0?"var(--bad)":"var(--muted)"}">${d>0?"↑ +"+d:d<0?"↓ "+d:"= เท่ารอบก่อน"} จากรอบที่แล้ว</span>`}</div>
   ${u.rounds.length>1?`<div><div class="hist" aria-label="คะแนนแต่ละรอบ">${hist.map((h,i)=>`<div class="${start+i===idx?"now":""}" style="height:${h.c/max*100}%"><span>${h.c}</span></div>`).join("")}</div><div class="histlab">${hist.map((h,i)=>`<span>R${start+i+1}</span>`).join("")}</div></div>`:""}
  </div>
  <div class="card stack"><h2>จุดที่ต้องทบทวนจากรอบนี้</h2>
   ${need.length?`<div><h3 style="color:var(--bad)">🔴 ทบทวนก่อนเลย</h3><ol class="list">${need.slice(0,3).map(recBtn).join("")}</ol>${need.length>3?`<div class="muted small">ตามด้วย: ${need.slice(3).map(x=>esc(x.t.name)).join(" · ")} (ทำทีละเรื่อง 3 เรื่องแรกก่อน แล้วค่อยทำ Check-up ใหม่)</div>`:""}</div>`:""}
   ${more.length?`<div><h3 style="color:var(--warn)">🟠 ฝึกเพิ่มอีกนิด</h3><ol class="list">${more.map(recBtn).join("")}</ol></div>`:""}
   ${!need.length&&!more.length?`<div class="note">เยี่ยมมาก! ทุกเรื่องผ่านเกณฑ์แล้ว ลองทำ Check-up อีกรอบเพื่อยืนยันว่าแม่นจริง 💪</div>`:""}
   ${up.length?`<div class="small"><b style="color:var(--good)">พัฒนาขึ้นจากรอบก่อน:</b> ${up.map(x=>esc(x.t.name)).join(" · ")}</div>`:""}
   ${down.length?`<div class="small"><b style="color:var(--bad)">คะแนนลดลงจากรอบก่อน:</b> ${down.map(x=>esc(x.t.name)).join(" · ")}</div>`:""}
   <div class="muted small">รอบละ 3 ข้อต่อเรื่อง ผลรอบเดียวจึงแกว่งได้ ระบบตัดสินจาก <b>คะแนนสะสมทุกรอบ + ทุกครั้งที่ฝึก</b> และคะแนนรอบล่าสุดรวมกัน</div>
  </div>
  <div class="card stack"><h2>รายละเอียดทุกเรื่อง</h2><div class="tscroll"><table class="res"><tr><th>เรื่อง</th><th>รอบนี้</th><th>รอบก่อน</th><th>สะสม</th><th>สถานะ</th></tr>
   ${rows.map(x=>`<tr><td><button class="link" onclick="lesson('${x.t.id}')">${esc(x.t.name)}</button></td><td>${x.now[0]}/${x.now[1]}</td><td>${x.pP===null?"–":x.pP+"%"} <span class="pill ${x.cls}">${x.trend}</span></td><td>${x.cum??0}% <span class="muted small">(${x.n} ข้อ)</span></td><td><span class="pill p-${x.st[0]}">${x.st[1]}</span></td></tr>`).join("")}</table></div></div>
  <div class="row"><button class="go" onclick="${need.length||more.length?`lesson('${(need[0]||more[0]).t.id}')`:"startRound()"}">${need.length||more.length?"เริ่มทบทวนเรื่องแรก →":"ทำ Check-up อีกรอบ"}</button>${Object.keys(u.miss).length?`<button class="alt" onclick="startMiss()">ฝึกข้อที่เคยผิด (${Object.keys(u.miss).length})</button>`:""}<button class="alt" onclick="reportCard()">📸 ใบรายงานผล</button><button class="alt" onclick="home()">หน้าหลัก</button></div>
  </div>`;window.scrollTo(0,0)}
function topicResult(t,c,n,prev){const u=user(),s=u.stats[t],cum=pct(s.c,s.n),st=status(cum,s.n);const p=prev?pct(prev.c,prev.n):null,nowP=pct(c,n);
  $().innerHTML=`<div class="card stack"><h2>ฝึก ${esc(TNAME[t])} เสร็จแล้ว</h2>
  <div class="score"><span class="big">${c}/${n}</span>${p===null?`<span class="pill p-new">ฝึกครั้งแรก</span>`:`<span class="delta" style="color:${nowP>p?"var(--good)":nowP<p?"var(--bad)":"var(--muted)"}">${nowP>p?"↑ ดีขึ้น":nowP<p?"↓ ลดลง":"= เท่าเดิม"} (ครั้งก่อน ${p}%)</span>`}</div>
  <div>คะแนนสะสมเรื่องนี้: <b>${cum}%</b> จาก ${s.n} ข้อ · <span class="pill p-${st[0]}">${st[1]}</span></div>
  <div class="note">${st[0]==="good"?"เรื่องนี้ผ่านแล้ว ไปทบทวนเรื่องอื่น หรือทำ Check-up รอบใหม่เพื่อดูพัฒนาการรวมได้เลย":"ลองอ่านสรุปอีกรอบ แล้วฝึกซ้ำได้ไม่จำกัด คะแนนสะสมถึง 80% ขึ้นไปถือว่าผ่าน"}</div>
  <div class="row"><button class="go" onclick="startTopic('${t}')">ฝึกเรื่องนี้อีกรอบ</button><button class="alt" onclick="lesson('${t}')">อ่านสรุปอีกครั้ง</button><button class="alt" onclick="home()">หน้าหลัก</button></div></div>`;window.scrollTo(0,0)}
function missResult(c,n){const left=Object.keys(user().miss).length;
  $().innerHTML=`<div class="card stack"><h2>ฝึกข้อที่เคยผิด</h2><div class="score"><span class="big">${c}/${n}</span></div>
  <div class="note">${left?`ยังเหลือข้อที่ต้องแก้อีก ${left} ข้อ (ข้อที่เคยผิดต้องตอบถูก 2 ครั้งจึงหายจากรายการ)`:"เคลียร์ข้อที่เคยผิดหมดแล้ว! 🎉"}</div>
  <div class="row">${left?`<button class="go" onclick="startMiss()">ฝึกต่อ</button>`:""}<button class="alt" onclick="startRound()">ทำ Check-up รอบใหม่</button><button class="alt" onclick="home()">หน้าหลัก</button></div></div>`;window.scrollTo(0,0)}

/* =================== LESSON =================== */
function lesson(id){const t=TOPICS.find(x=>x.id===id),u=user(),s=u.stats[id]||{c:0,n:0},cum=pct(s.c,s.n),st=status(cum,s.n);
  $().innerHTML=`<div class="card stack"><button class="link" style="align-self:flex-start" onclick="home()">← หน้าหลัก</button>
  <h1>${esc(t.name)}</h1><div class="row"><span class="pill p-${st[0]}">${st[1]}</span><span class="muted small">สะสม ${cum??0}% · ทำไปแล้ว ${s.n} ข้อ · ฝึกเรื่องนี้ ${(u.prac[id]||[]).length} ครั้ง</span></div>
  ${t.lesson.map(l=>`<div class="rule"><h3>${l[0]}</h3><p>${l[1]}</p><p class="ex">${l[2]}</p></div>`).join("")}
  <div class="row"><button class="go" onclick="startTopic('${id}')">เริ่มฝึก ${id==="v3"?12:8} ข้อ →</button></div></div>`;window.scrollTo(0,0)}


/* =================== REPORT CARD (แคปหน้าจอส่งครู) =================== */
function reportCard(){const u=user();const R=u.rounds,first=R[0],last=R[R.length-1];
  const rows=TOPICS.map(t=>{const s=u.stats[t.id]||{c:0,n:0},c=pct(s.c,s.n),st=status(c,s.n);return{t,c,n:s.n,st,pr:(u.prac[t.id]||[]).length}});
  const weak=rows.filter(x=>x.st[0]!=="good");const pracTotal=rows.reduce((a,x)=>a+x.pr,0);
  const allPass=R.length>0&&!weak.length;
  const now=new Date();const stamp=now.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})+" "+now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  $().innerHTML=`<div class="card stack" style="border:3px solid var(--navy)">
  <div class="row" style="justify-content:space-between"><div><div class="qtopic">ใบรายงานผล · Homework</div><h1 style="font-size:26px">${esc(ME)}</h1></div><div class="muted small" style="text-align:right">Present Perfect Quest<br>${stamp}</div></div>
  ${R.length?`<div class="score"><span class="big" style="font-size:44px">${last.c}/${last.n}</span><span class="muted">Check-up ล่าสุด (รอบที่ ${R.length})${R.length>1?`<br>รอบแรก ${first.c}/${first.n} → ล่าสุด ${last.c}/${last.n} <b style="color:${last.c>=first.c?"var(--good)":"var(--bad)"}">${last.c>=first.c?"↑ +"+(last.c-first.c):"↓ "+(last.c-first.c)}</b>`:""}</span></div>`:`<div class="warnbar">ยังไม่ได้ทำ Check-up — ทำอย่างน้อย 1 รอบก่อนส่งนะ</div>`}
  <table class="res"><tr><th>เรื่อง</th><th>สะสม</th><th>ฝึก (ครั้ง)</th><th>สถานะ</th></tr>${rows.map(x=>`<tr><td>${esc(x.t.name)}</td><td>${x.c??0}%</td><td>${x.pr}</td><td><span class="pill p-${x.st[0]}">${x.st[1]}</span></td></tr>`).join("")}</table>
  <div class="note">${allPass?"🏆 <b>ผ่านครบทุกเรื่องแล้ว!</b> (คะแนนสะสม 80% ขึ้นไปทุกเรื่อง)":`💪 ยังต้องฝึก: <b>${weak.map(x=>esc(x.t.name)).join(" · ")||"ทำ Check-up ก่อน"}</b>`}<br><span class="small">ฝึกรายเรื่องรวม ${pracTotal} ครั้ง · Check-up ${R.length} รอบ</span></div>
  <div style="text-align:center;font-weight:700;color:var(--accent)">📸 แคปหน้าจอนี้ แล้วส่งในระบบส่งการบ้าน</div>
  <div class="row" style="justify-content:center"><button class="alt" onclick="home()">← กลับไปฝึกต่อ</button></div></div>`;window.scrollTo(0,0)}

/* =================== HOME =================== */
function pickName(n){n=(n||"").trim();if(!n)return;ME=n;DB.last=n;user();save();home()}
function logout(){ME=null;home()}
function copySummary(){const u=user();const last=u.rounds[u.rounds.length-1];
  let t=`📘 ENG Spark Review Quest\n👤 ${ME}\n🔁 Check-up ${u.rounds.length} รอบ${last?` · ล่าสุด ${last.c}/${last.n}`:""}\n${u.rounds.length?"📈 คะแนนทุกรอบ: "+u.rounds.map(r=>r.c+"/"+r.n).join(" → ")+"\n":""}\n`;
  TOPICS.forEach(x=>{const s=u.stats[x.id]||{c:0,n:0},c=pct(s.c,s.n),st=status(c,s.n);t+=`${st[0]==="bad"?"🔴":st[0]==="warn"?"🟠":st[0]==="good"?"🟢":"⚪"} ${x.name}: ${c??"-"}${c===null?"":"%"} (${s.n} ข้อ)\n`});
  const box=document.getElementById("sumbox");box.hidden=false;box.value=t;
  const done=()=>{document.getElementById("cpmsg").textContent="คัดลอกแล้ว วางใน LINE ส่งครูได้เลย"};
  try{navigator.clipboard.writeText(t).then(done,()=>{box.select();document.getElementById("cpmsg").textContent="กดค้างที่ข้อความเพื่อคัดลอก"})}catch(e){box.select()}}
function home(){Q=null;document.getElementById("who").innerHTML=ME?`👤 <b>${esc(ME)}</b> · <button class="link small" onclick="logout()">เปลี่ยนชื่อ</button>`:"";
  if(!ME){$().innerHTML=`<div class="card stack"><h1>Have you ever…? 🌍</h1>
   <p style="margin:0">ทบทวนคาบ Present Perfect: ทำ Check-up 15 ข้อ (5 เรื่อง เรื่องละ 3 ข้อ) ระบบจะบอกจุดอ่อน แล้วฝึกรายเรื่องได้ไม่จำกัด ทำเสร็จกด <b>📸 ใบรายงานผล</b> แล้วแคปหน้าจอส่งในระบบส่งการบ้าน</p>
   <h3>เลือกชื่อของตัวเอง</h3><div class="names">${STUDENTS.map(n=>`<button onclick="pickName('${n}')">${n}</button>`).join("")}</div>
   <form class="row" onsubmit="event.preventDefault();pickName(document.getElementById('nm').value)"><input type="text" id="nm" placeholder="หรือพิมพ์ชื่อเล่น"><button type="submit">เข้าใช้</button></form>
   ${STORAGE_OK?`<div class="muted small">ผลจะถูกบันทึกในเครื่องนี้ ใช้มือถือ/แท็บเล็ตเครื่องเดิมทุกครั้งนะ</div>`:`<div class="warnbar">เบราว์เซอร์นี้บันทึกผลไม่ได้ (อาจเป็นโหมดไม่ระบุตัวตน) ทำแบบฝึกได้ แต่ปิดหน้าแล้วผลจะหาย</div>`}</div>`;return}
  const u=user(),last=u.rounds[u.rounds.length-1],missN=Object.keys(u.miss).length;
  const rows=TOPICS.map(t=>{const s=u.stats[t.id]||{c:0,n:0},c=pct(s.c,s.n),st=status(c,s.n);return{t,c,n:s.n,st}});
  $().innerHTML=`<div class="stack">
   <div class="card stack"><h1>สวัสดี ${esc(ME)} 👋</h1>
    ${last?`<div class="score"><span class="big">${last.c}/${last.n}</span><span class="muted">Check-up ล่าสุด (รอบที่ ${u.rounds.length}) · ${fmtDate(last.at)}</span></div>`:`<p style="margin:0">เริ่มจาก Check-up รอบแรก เพื่อดูว่าเรื่องไหนแม่นแล้ว เรื่องไหนต้องทบทวน</p>`}
    <div class="row"><button class="go" onclick="startRound()">${u.rounds.length?"ทำ Check-up รอบที่ "+(u.rounds.length+1):"เริ่ม Check-up รอบแรก"} →</button>
    ${last?`<button class="alt" onclick="roundResult(${u.rounds.length-1})">ดูผลรอบล่าสุด</button>`:""}
    ${missN?`<button class="alt" onclick="startMiss()">ฝึกข้อที่เคยผิด (${missN})</button>`:""}</div></div>
   <div class="card stack"><div class="row" style="justify-content:space-between"><h2>ทบทวนรายเรื่อง</h2><span class="muted small">กดเพื่ออ่านสรุปและฝึก</span></div>
    <div class="topics">${rows.map(x=>`<button class="tp" onclick="lesson('${x.t.id}')"><span class="nm">${esc(x.t.name)}</span><span class="pct"><span class="pill p-${x.st[0]}">${x.st[1]}</span> ${x.c===null?"":x.c+"%"}</span><span class="bar"><i class="c-${x.st[0]}" style="width:${x.c??0}%"></i></span></button>`).join("")}</div>
